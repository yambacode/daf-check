name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
        extra: ["test", "c2pa,test"]
    name: Python ${{ matrix.python }} [${{ matrix.extra }}]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install
        run: python -m pip install -e ".[${{ matrix.extra }}]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
