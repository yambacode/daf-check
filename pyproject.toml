[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "daf-check"
version = "0.2.1"
description = "Free, open-source checker for Dream Art Fields' AI marks (invisible pixel signature and C2PA manifest)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "YambaCode AB" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.22", "Pillow>=9.1"]
keywords = ["ai-act", "c2pa", "watermark", "provenance", "ai-generated", "detection"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Graphics",
]

[project.optional-dependencies]
c2pa = ["c2pa-python>=0.38"]
test = ["pytest", "ruff"]

[project.urls]
Homepage = "https://github.com/yambacode/daf-check"
Specification = "https://github.com/yambacode/daf-check/blob/main/SPEC.md"

[project.scripts]
daf-check = "daf_check.cli:main"

[tool.setuptools]
packages = ["daf_check"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
